<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Prompt Builder & Auditor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Prompt Builder -->
    <div class="bg-white rounded-3xl shadow-xl p-6">
      <h1 class="text-3xl font-bold mb-2">AI Prompt Builder</h1>
      <p class="text-gray-600 mb-6">
        Build optimized prompts using modern prompt-engineering frameworks.
      </p>

      <div id="builder-fields"></div>
    </div>

    <!-- Output + Auditor -->
    <div class="space-y-6">

      <div class="bg-white rounded-3xl shadow-xl p-6">
        <h2 class="text-2xl font-bold mb-4">Generated Prompt</h2>

        <pre id="generatedPrompt" class="bg-slate-900 text-green-300 rounded-2xl p-4 overflow-auto whitespace-pre-wrap text-sm min-h-[300px]"></pre>

        <button onclick="copyPrompt()"
          class="mt-4 px-5 py-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 transition">
          Copy Prompt
        </button>
      </div>

      <div class="bg-white rounded-3xl shadow-xl p-6">
        <h2 class="text-2xl font-bold mb-4">Prompt Auditor Dashboard</h2>

        <textarea id="draftPrompt"
          placeholder="Paste your existing prompt here..."
          class="w-full border rounded-2xl p-4 min-h-[180px] focus:outline-none focus:ring-2 focus:ring-purple-400"
          oninput="auditPrompt()"></textarea>

        <div class="mt-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-xl font-semibold">Prompt Score</h3>
            <div id="score" class="text-2xl font-bold">0/6</div>
          </div>

          <div id="auditResults" class="space-y-3"></div>
        </div>
      </div>
    </div>
  </div>

<script>

const tips = {
  task: "Be specific about what you want the AI to accomplish.",
  context: "Provide background, audience, and constraints.",
  exemplar: "Examples improve consistency and output quality.",
  persona: "Define the AI's role or expertise level.",
  format: "Specify exact structure or formatting requirements.",
  tone: "Clarify the communication style and voice."
};

const suggestions = {
  Task: "Define the exact deliverable more clearly.",
  Context: "Add background information and constraints.",
  Exemplar: "Include a sample or example output.",
  Persona: "Assign the AI a role or expertise level.",
  Format: "Specify layout, formatting, or structure.",
  Tone: "Clarify the communication style you want."
};

const fields = ["task", "context", "exemplar", "persona", "format", "tone"];

const builderContainer = document.getElementById("builder-fields");

fields.forEach(field => {
  const div = document.createElement("div");
  div.className = "mb-5";

  div.innerHTML = `
    <label class="block text-sm font-semibold capitalize mb-2">${field}</label>
    <textarea id="${field}"
      class="w-full border rounded-2xl p-3 min-h-[90px] focus:outline-none focus:ring-2 focus:ring-blue-400"
      placeholder="Enter ${field}..."
      oninput="generatePrompt()"></textarea>

    <div class="mt-2 text-sm text-blue-700 bg-blue-50 rounded-xl p-3">
      <strong>Pro Tip:</strong> ${tips[field]}
    </div>
  `;

  builderContainer.appendChild(div);
});

function generatePrompt() {
  const values = {};

  fields.forEach(field => {
    values[field] = document.getElementById(field).value || `[Add ${field}]`;
  });

  const prompt = `# AI Prompt\n\n## Task\n${values.task}\n\n## Context\n${values.context}\n\n## Exemplar\n${values.exemplar}\n\n## Persona\n${values.persona}\n\n## Format\n${values.format}\n\n## Tone\n${values.tone}\n\n---\n\nUsing the information above, generate the requested output while following all constraints, formatting requirements, and tone instructions carefully.`;

  document.getElementById("generatedPrompt").textContent = prompt;
}

function copyPrompt() {
  const text = document.getElementById("generatedPrompt").textContent;
  navigator.clipboard.writeText(text);
  alert("Prompt copied to clipboard!");
}

function auditPrompt() {
  const text = document.getElementById("draftPrompt").value;

  const checks = {
    Task: /(task|create|build|write|generate|analyze|explain)/i.test(text),
    Context: /(context|background|audience|company|project|constraints)/i.test(text),
    Exemplar: /(example|sample|for instance|like this)/i.test(text),
    Persona: /(act as|you are|expert|specialist|role)/i.test(text),
    Format: /(format|markdown|table|json|bullet|structure)/i.test(text),
    Tone: /(tone|professional|friendly|technical|formal|casual)/i.test(text)
  };

  const score = Object.values(checks).filter(Boolean).length;

  document.getElementById("score").textContent = `${score}/6`;

  const resultsDiv = document.getElementById("auditResults");
  resultsDiv.innerHTML = "";

  Object.entries(checks).forEach(([key, passed]) => {
    const div = document.createElement("div");

    div.className = `p-4 rounded-2xl border ${passed
      ? 'bg-green-50 border-green-200'
      : 'bg-red-50 border-red-200'}`;

    div.innerHTML = `
      <div class="flex justify-between items-center">
        <span class="font-semibold">${key}</span>
        <span>${passed ? '✅ Present' : '❌ Missing'}</span>
      </div>
      ${!passed ? `<p class="text-sm mt-2 text-gray-700">${suggestions[key]}</p>` : ''}
    `;

    resultsDiv.appendChild(div);
  });
}

generatePrompt();

</script>

</body>
</html>
